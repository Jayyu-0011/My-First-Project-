<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <title>Login Page</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form>


      <div class="input-group">
        <i class="fa fa-user"></i>
        <input type="text" placeholder="Username or Email" required>
      </div>

      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input type="password" placeholder="Enter your Password" required>
      </div>

      <div class="options">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>

    </form>

    <div class="signup">
      Don't have an account? <a href="../Register/RegisterPage.html">Sign up</a>
    </div>

    <div class="social-login">
      <p>or connect with</p>
      
      <div class="social-icons">
        <a href="https://www.facebook.com/login/"><i class="fab fa-facebook"></i></a>
        <a href="https://accounts.google.com/v3/signin/accountchooser?continue=https%3A%2F%2Faccounts.google.com%2F&dsh=S1428702601%3A1770913593258469&followup=https%3A%2F%2Faccounts.google.com%2F&ifkv=AXbMIuDfB3jgicGa4reZanbjlmCvMXSXcaPu5G9Ck-AdDcGK5sXt98gpXKcJ2AG_lzcNmEqKYbRGxw&passive=1209600&flowName=GlifWebSignIn&flowEntry=ServiceLogin"><i class="fab fa-google"></i></a>
        <a href="https://github.com/login"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>
</body>
</html>
